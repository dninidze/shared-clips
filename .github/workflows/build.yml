name: Build and test

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shared-clips-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    name: Device tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app, tests and fake TikTok
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :faketiktok:assembleDebug --stacktrace
      - name: Run device tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each line runs on its own. Test failures are recorded, diagnostics printed to the job log
          # (readable without downloading artifacts), and the step fails at the end.
          script: |
            adb install -r faketiktok/build/outputs/apk/debug/faketiktok-debug.apk
            adb logcat -c || true
            gradle :app:connectedDebugAndroidTest --stacktrace || touch tests-failed
            adb logcat -d > logcat.txt || true
            adb shell dumpsys jobscheduler > jobscheduler.txt || true
            echo "::group::Failed tests"; python3 .github/scripts/print_failures.py app/build/outputs/androidTest-results/connected; echo "::endgroup::"
            echo "::group::App and test logcat"; grep -E "SharedClips|FakeTikTok|WM-|BackgroundActivity|Background activity|Abort background|ActivityTaskManager: START|MediaProvider.*(sc_test_|rename|Permission)|AndroidRuntime" logcat.txt | tail -n 600 || true; echo "::endgroup::"
            echo "::group::Scheduled jobs"; grep -B2 -A12 "app.sharedclips" jobscheduler.txt | head -n 200 || true; echo "::endgroup::"
            test ! -f tests-failed
      - name: Upload test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-tests-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            jobscheduler.txt
